server {
    charset utf-8;
    client_max_body_size 128M;

    listen 80;
    server_name designnews.ai.local;
    root /var/www/design-news-AI/frontend/web;
    index index.php;

    access_log /var/log/nginx/frontend_access.log;
    error_log /var/log/nginx/frontend_error.log;
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php-fpm:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~* /\. {
        deny all;
    }
}

server {
    charset utf-8;
    client_max_body_size 128M;

    listen 80;
    server_name admin.designnews.ai.local;
    root /var/www/design-news-AI/backend/web;
    index index.php;

    access_log /var/log/nginx/backend_access.log;
    error_log /var/log/nginx/backend_error.log;
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php-fpm:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~* /\. {
        deny all;
    }
     location ~* \.css$ {
            expires 1d;
            add_header Cache-Control "public";
        }

        # Локація для JS файлів
        location ~* \.js$ {
            expires 1d;
            add_header Cache-Control "public";
        }

        # Локація для зображень (jpg, jpeg, png, gif, svg)
        location ~* \.(jpg|jpeg|png|gif|svg)$ {
            expires 30d;
            add_header Cache-Control "public";
        }

        # Локація для шрифтів
        location ~* \.(woff|woff2|ttf|otf)$ {
            expires 30d;
            add_header Cache-Control "public";
        }

        # Статичні файли з vendor (CSS, JS, HTML)
        location /vendor/ {
            alias /var/www/article-education/vendor/; # Доступ до іншої директорії
            try_files $uri $uri/ =404;

            # Дозволити кешування для статичних файлів (CSS, JS, HTML)
            location ~* \.(css|js|html)$ {
                expires 7d;
                add_header Cache-Control "public";
            }

           # Локація для зображень (jpg, jpeg, png, gif, svg)
        location ~* \.(jpg|jpeg|png|gif|svg)$ {
            expires 30d;
            add_header Cache-Control "public";
        }

        # Локація для шрифтів
        location ~* \.(woff|woff2|ttf|otf)$ {
            expires 30d;
            add_header Cache-Control "public";
        }

            # Забороняємо виконання PHP файлів у цій директорії
            location ~ \.php$ {
                deny all;
            }
        }
}
